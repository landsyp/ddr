name: Branch CI
run-name: Branch CI - ${{ github.ref_name }}

on:
  push:
    branches:
      - "**"
  create:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-checks:
    name: Build and test
    runs-on: ubuntu-latest
    if: github.event_name != 'create' || github.event.ref_type == 'branch'
    timeout-minutes: 15
    env:
      CI: true

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify branch context
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Event: ${{ github.event_name }}"
          echo "Commit: ${{ github.sha }}"

      - name: Run test suite when configured
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:ci'] ? 0 : 1)"; then
            npm run test:ci
          elif node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "::notice title=No test suite configured::Add a package.json test script and this branch CI will run it automatically."
          fi

      - name: Generate BDD test reports
        if: always()
        run: npm run bdd:report

      - name: Build React app
        run: npm run build

      - name: Smoke test API modules
        run: |
          DDR_DATABASE_PATH="$RUNNER_TEMP/weserve-ci.sqlite" node -e "import('./server/db.js').then(() => console.log('SQLite store loaded'))"
          node --check server/index.js
          node --check scripts/dev.js

      - name: Write quality summary
        if: always()
        run: |
          {
            echo "## Branch CI quality report"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Branch | ${{ github.ref_name }} |"
            echo "| Commit | ${{ github.sha }} |"
            echo "| Test command | npm run test:ci |"
            echo "| Report artifact | weserve-test-report |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weserve-test-report
          path: reports/
          if-no-files-found: warn

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: branch-checks
    if: always() && (github.event_name != 'create' || github.event.ref_type == 'branch')
    steps:
      - name: Enforce branch quality gate
        run: |
          if [ "${{ needs.branch-checks.result }}" != "success" ]; then
            echo "Quality gate failed because Build and test result was: ${{ needs.branch-checks.result }}"
            exit 1
          fi
          echo "Quality gate passed."
