name: Branch CI
run-name: Branch CI - ${{ github.ref_name }}

on:
  push:
    branches:
      - "**"
  create:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-checks:
    name: Build and test
    runs-on: ubuntu-latest
    if: github.event_name != 'create' || github.event.ref_type == 'branch'
    timeout-minutes: 15
    env:
      CI: true
      QUALITY_GATE_THRESHOLD: 80

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify branch context
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Event: ${{ github.event_name }}"
          echo "Commit: ${{ github.sha }}"

      - name: Run quality gate test suite
        run: npm run test:ci

      - name: Build React app
        run: npm run build

      - name: Smoke test API modules
        run: |
          DDR_DATABASE_PATH="$RUNNER_TEMP/weserve-ci.sqlite" node -e "import('./server/db.js').then(() => console.log('SQLite store loaded'))"
          node --check server/index.js
          node --check scripts/dev.js

      - name: Upload test reports
        id: upload-test-reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weserve-test-report
          path: reports/
          if-no-files-found: warn

      - name: Write quality summary
        if: always()
        run: |
          PASS_RATE="not available"
          READY_TO_INTEGRATE="false"
          REPORT_ARTIFACT_URL="${{ steps.upload-test-reports.outputs.artifact-url }}"
          if [ -f reports/summary.json ]; then
            PASS_RATE="$(node -e "const s=require('./reports/summary.json'); console.log(s.passRate + '%')")"
            READY_TO_INTEGRATE="$(node -e "const s=require('./reports/summary.json'); console.log(s.readyToIntegrate ? 'yes' : 'no')")"
          fi
          {
            echo "## Branch CI quality report"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Branch | ${{ github.ref_name }} |"
            echo "| Commit | ${{ github.sha }} |"
            echo "| Test command | npm run test:ci |"
            echo "| Test pass rate | ${PASS_RATE} |"
            echo "| Quality gate threshold | ${QUALITY_GATE_THRESHOLD}% test pass rate |"
            echo "| Ready to integrate | ${READY_TO_INTEGRATE} |"
            echo "| Integration rule | Ready when test pass rate is greater than or equal to ${QUALITY_GATE_THRESHOLD}% |"
            if [ -n "${REPORT_ARTIFACT_URL}" ]; then
              echo "| Report artifact | [Download weserve-test-report](${REPORT_ARTIFACT_URL}) |"
            else
              echo "| Report artifact | weserve-test-report |"
            fi
            if [ -f reports/test-report.md ]; then
              echo ""
              echo "## Full test report"
              echo ""
              cat reports/test-report.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: branch-checks
    if: always() && (github.event_name != 'create' || github.event.ref_type == 'branch')
    steps:
      - name: Enforce branch quality gate
        run: |
          if [ "${{ needs.branch-checks.result }}" != "success" ]; then
            echo "Quality gate failed because the branch did not meet the 80% test pass threshold or build/smoke checks failed."
            echo "Build and test result was: ${{ needs.branch-checks.result }}"
            exit 1
          fi
          echo "Quality gate passed: test pass rate met or exceeded 80% and build/smoke checks succeeded."
